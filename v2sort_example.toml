[settings]
urls = [
  "https://www.gstatic.com/generate_204",
  "https://cloudflare.com/cdn-cgi/trace",
]
speedtest_url = "https://speed.cloudflare.com/__down?bytes=10485760"

# with allow = true only the entries listed in list are allowed

[settings.protocols]
allow = false
list = ["bless+over+pppoe"]

[settings.countries]
allow = false
list = ["KP"]

[settings.cidrs]
allow = true
list = ["0.0.0.0/0", "::/0"]
