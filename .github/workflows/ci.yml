name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go build -ldflags "-X main.version=ci" -o v2sort .
      - run: ./v2sort --version | grep "version ci "
      - run: go test ./...
